<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(function(){var t;try{t=localStorage.getItem('nrcp-theme')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})()</script>
<title>NRCP Expert Engagement Post-Activity Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ===== NRCP brand tokens — change these to re-theme ===== */
:root{
  --brand:#283a94; --brand-dark:#1b2870; --brand-light:#e9ecf9;
  --accent:#2f6fed; --accent-dark:#1d4fc4; --sun:#bcd4ff;
  --ink:#1b2437; --muted:#5b6579; --line:#d9e0ee; --bg:#f4f7fc; --card:#fff; --field:#fff; --btn:#283a94; --btn-hover:#1b2870; --hdr1:#1b2870; --hdr2:#283a94; --shadow:rgba(40,58,148,.08); --chev:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23283a94' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  --ok:#2f6fed; --err:#c62f3e; --radius:16px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
:root[data-theme=dark]{color-scheme:dark;--brand:#8ab0ff;--brand-dark:#0a1230;--brand-light:#1a2a5e;--accent:#4b86ff;--accent-dark:#3a6fe0;--sun:#9ec1ff;--ink:#e6ebf7;--muted:#9aa7c7;--line:#2a3768;--bg:#0b1129;--card:#121a3a;--field:#0d1431;--btn:#2f5fe0;--btn-hover:#3f77f0;--hdr1:#08102e;--hdr2:#14226b;--shadow:rgba(0,0,0,.35);--chev:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238ab0ff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>")}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
header.top{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;border-bottom:5px solid var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:16px;padding:22px 0}
.brand img{width:84px;height:84px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand small{display:block;letter-spacing:.08em;font-size:.72rem;opacity:.85;text-transform:uppercase}
.brand h1{margin:2px 0 0;font:700 1.15rem/1.3 'Merriweather',Georgia,serif}
.brand h2{margin:2px 0 0;font-size:.95rem;font-weight:600;color:var(--sun)}
main.wrap{padding:48px 20px 56px}
.progress{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:0 2px 10px var(--shadow);margin-bottom:20px;position:sticky;top:12px;z-index:5}
.steps{display:flex;gap:6px;list-style:none;margin:0 0 12px;padding:0}
.steps li{flex:1;text-align:center;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
.steps li .dot{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:var(--brand-light);color:var(--brand);font-size:.85rem;transition:.2s}
.steps li.active .dot{background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(47,111,237,.3)}
.steps li.done .dot{background:var(--ok);color:#fff}
.steps li.active{color:var(--brand)}
.bar{height:8px;background:var(--brand-light);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px;transition:width .35s}
.card{background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:0 4px 18px var(--shadow);border-top:4px solid var(--accent);animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 4px;color:var(--brand);font-size:1.25rem}
.card .lead{color:var(--muted);margin:0 0 22px;font-size:.95rem;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.grid>*{grid-column:span 6}
.grid>.c3{grid-column:span 3}.grid>.c4{grid-column:span 4}.grid>.c6{grid-column:span 6}.grid>.c8{grid-column:span 8}
.lbl2{font-weight:600;font-size:.98rem;margin-bottom:-6px}
input[data-upper],input[data-upper]::placeholder{text-transform:uppercase}
input.combo{padding-right:40px;background:var(--field) var(--chev) no-repeat right 14px center}
input.combo::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;width:40px}
input.combo{position:relative}
.ss{position:relative}
.ss-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;max-height:264px;overflow-y:auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 14px 30px rgba(27,40,112,.18);padding:6px;margin:0;list-style:none}
.ss-list[hidden]{display:none}
.ss-list li{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:.96rem;line-height:1.35}
.ss-list li.on,.ss-list li:hover{background:var(--brand-light);color:var(--brand)}
.ss-list li.use{color:var(--muted);font-size:.88rem;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;margin-bottom:4px}
.ss-list mark{background:none;color:var(--brand);font-weight:700}
.grid>.full,.full{grid-column:1/-1}
.q{margin-bottom:26px}
.q>label,.q>.lbl,legend{display:block;font-weight:600;margin-bottom:8px;font-size:.98rem;padding:0}
fieldset{border:0;margin:0 0 26px;padding:0}
.hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);transition:.15s}
textarea{min-height:110px;resize:vertical}
select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:40px;background:var(--field) var(--chev) no-repeat right 14px center}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(40,58,148,.12)}
.invalid{border-color:var(--err)!important}
.err{color:var(--err);font-size:.82rem;margin-top:4px;display:none}
.opts{display:grid;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;transition:.15s;background:var(--field)}
.opt span:before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);background:var(--field);transition:.15s}
.opt input:checked+span{border-color:var(--brand);background:var(--brand-light);font-weight:600}
.opt input:checked+span:before{border-color:var(--brand);background:radial-gradient(var(--brand) 45%,var(--field) 50%)}
.opt input:focus-visible+span{box-shadow:0 0 0 4px rgba(40,58,148,.2)}
.opt:hover span{border-color:var(--brand)}
.rate{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.rate>b{display:block;margin-bottom:10px;font-weight:600}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .opt span{justify-content:center;padding:10px 4px;font-size:.82rem;text-align:center;flex-direction:column;gap:6px}
.scale .opt span:before{width:14px;height:14px}
.inline{margin-top:10px;display:none}
.grid>*,.range>*{min-width:0}
input[type=date]{min-width:0;max-width:100%;display:block;min-height:48px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.4em}
.range{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.range small{display:block;color:var(--muted);font-size:.78rem;font-weight:600;margin-bottom:4px}
.range .to{color:var(--brand);font-weight:700;padding-bottom:12px}
@media(max-width:640px){.range{grid-template-columns:minmax(0,1fr);gap:12px}.range .to{display:none}}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.btn{font:600 .95rem var(--font);border:0;border-radius:999px;padding:13px 26px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--btn);color:#fff}
.btn.primary:hover{background:var(--btn-hover)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.ghost:hover{background:var(--brand-light)}
.btn.gold{background:var(--accent);color:#fff}
.btn.gold:hover{background:var(--accent-dark)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.review dl{margin:0 0 22px}
.review .sec{background:var(--brand-light);color:var(--brand);font-weight:700;padding:8px 14px;border-radius:10px;margin:18px 0 10px;font-size:.9rem}
.review dt{font-weight:600;font-size:.88rem;margin-top:10px}
.review dd{margin:2px 0 0;color:var(--ink);opacity:.85;white-space:pre-wrap;font-size:.92rem}
.review .na{color:#9aa3b5;font-style:italic}
.thanks{text-align:center;padding:16px;color:var(--brand);font-weight:700;margin:28px 0 32px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--brand-dark);color:#fff;padding:12px 22px;border-radius:999px;transition:.3s;font-size:.9rem;z-index:20}
.toast.show{transform:translateX(-50%)}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:12px;padding:24px 20px 40px;border-top:1px solid var(--line)}
@media(max-width:640px){.grid>*,.grid>.c3,.grid>.c4,.grid>.c6,.grid>.c8{grid-column:1/-1}.grid>.m6{grid-column:span 6}.card{padding:20px}.scale{grid-template-columns:1fr 1fr}.steps li span.t{display:none}.brand h1{font-size:1rem}.nav .btn{padding:12px 18px}}
header.top .wrap{position:relative}
.icon-btn{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.45);transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.24)}
.icon-btn:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.icon-btn svg{width:22px;height:22px}.ic-sun{display:none}
:root[data-theme=dark] .ic-sun{display:block}:root[data-theme=dark] .ic-moon{display:none}
body.modal-open{overflow:hidden}
.backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(8,14,40,.6);backdrop-filter:blur(3px);animation:fade .15s ease}
.backdrop[hidden]{display:none}
.modal{width:100%;max-width:440px;background:var(--card);color:var(--ink);border-radius:var(--radius);padding:26px;border-top:4px solid var(--accent);box-shadow:0 24px 60px rgba(0,0,0,.35);animation:in .2s ease}
.m-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--brand-light);color:var(--brand);margin-bottom:14px}
.m-icon svg{width:24px;height:24px}
.modal h3{margin:0 0 8px;color:var(--brand);font-size:1.2rem}
.modal .desc{color:var(--muted);font-size:.95rem;margin:0}
.modal .desc b{color:var(--ink)}
.chips{display:grid;gap:6px;margin:12px 0 4px;font-size:.88rem}
.chips span{background:var(--brand-light);color:var(--brand);border-radius:10px;padding:7px 12px;word-break:break-all}
.m-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:22px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:520px){.m-actions{flex-direction:column-reverse}.m-actions .btn{justify-content:center;width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.icon-btn,.backdrop{display:none}.progress,.nav,.toast{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap brand">
  <img id="logo" alt="NRCP logo">
  <div>
    <small>Department of Science and Technology</small>
    <h1>National Research Council of the Philippines</h1>
    <h2>Expert Engagement Post-Activity Survey</h2>
  </div>
  <button type="button" class="icon-btn" id="themeToggle" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div></header>

<main class="wrap">
  <div class="progress" aria-label="Progress">
    <ol class="steps" id="steps"></ol>
    <div class="bar"><i id="fill"></i></div>
  </div>
  <form id="app" class="card" novalidate onsubmit="return false"></form>
</main>
<footer>DOST–NRCP · Your feedback drives our continuous improvement</footer>
<div class="toast" id="toast"></div>
<div class="backdrop" id="modal" hidden><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mDesc"><div class="m-icon" id="mIcon"></div><h3 id="mTitle"></h3><div class="desc" id="mDesc"></div><div class="m-actions" id="mActions"></div></div></div>

function render(){

function answer(f){

function ssOpen(inp){
  const f = ALL.find(x => x.id === inp.id), list = inp.nextElementSibling, raw = inp.value.trim(), q = raw.toLowerCase();
  const exact = f.o.some(o => o.toLowerCase() === q), all = !q || exact;
  const m = all ? f.o : f.o.filter(o => o.toLowerCase().includes(q));
  const hl = o => { if (all) return esc(o); const k = o.toLowerCase().indexOf(q); return esc(o.slice(0,k)) + '<mark>' + esc(o.slice(k,k+q.length)) + '</mark>' + esc(o.slice(k+q.length)); };
  list.innerHTML = (all ? '' : `<li class="use" data-use="1">${m.length ? '' : 'No match. '}Use “${esc(raw)}” as typed</li>`)
    + m.map(o => `<li role="option" data-v="${esc(o)}" class="${exact && o.toLowerCase() === q ? 'on' : ''}">${hl(o)}</li>`).join('');
  list.hidden = false;
  const cur = list.querySelector('li.on'); if (cur) list.scrollTop = cur.offsetTop - 60; else list.scrollTop = 0;
}
function ssClose(inp){ const l = inp.nextElementSibling; if (l) l.hidden = true; }
function ssPick(inp, val){
  inp.value = val; data[inp.id] = val; save(); ssClose(inp);
  inp.classList.remove('invalid'); inp.closest('.q').querySelector('.err').style.display = 'none';
}

app.addEventListener('focusout', e => { if (e.target.dataset.ss !== undefined) ssClose(e.target); });

app.addEventListener('keydown', e => {
  const t = e.target; if (t.dataset.ss === undefined) return;
  const list = t.nextElementSibling, items = [...list.querySelectorAll('li[data-v]')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (list.hidden) ssOpen(t);
    const its = [...list.querySelectorAll('li[data-v]')]; if (!its.length) return;
    let i = its.findIndex(x => x.classList.contains('on')); its.forEach(x => x.classList.remove('on'));

    e.preventDefault(); const on = list.querySelector('li.on[data-v]');

function syncDates(changed){
  const s = document.getElementById('date'), e = document.getElementById('date_end');
  e.min = s.value || '';
  if (s.value && (!e.value || e.value < s.value)) { e.value = s.value; data.date_end = s.value; }
  if (changed === 'date_end' && !e.value) { e.value = s.value; data.date_end = s.value; }
}
function fmtRange(a, b){
  if (!a) return ''; if (!b || b === a) return fmtDate(a);
  const x = new Date(a+'T00:00'), y = new Date(b+'T00:00'), L = 'en-PH';
  if (x.getFullYear() !== y.getFullYear()) return fmtDate(a) + ' – ' + fmtDate(b);
  if (x.getMonth() !== y.getMonth()) return x.toLocaleDateString(L,{month:'long',day:'numeric'}) + ' – ' + fmtDate(b);
  return x.toLocaleString(L,{month:'long'}) + ' ' + x.getDate() + '–' + y.getDate() + ', ' + x.getFullYear();
}
function validate(){
  if (step >= STEPS.length) return true;
  let ok = true, first = null;
  STEPS[step].fields.filter(f => f.req && !(f.rs && isRS())).forEach(f => {
    if (data[f.id] && String(data[f.id]).trim()) return;
    ok = false;
    const el = f.t === 'radio' ? document.querySelector(`[data-f="${f.id}"]`) : document.getElementById(f.id);
    if (f.t === 'radio') el.querySelector('.err').style.display = 'block';
    else { el.classList.add('invalid'); el.closest('.q').querySelector('.err').style.display = 'block'; }
    first = first || el;
  });
  if (!ok) { first.scrollIntoView({behavior:'smooth',block:'center'}); toast('Please complete the required fields (*)'); }
  return ok;
}

/* ===== PDF generation ===== */
async function makePDF(silent){
  if (!window.jspdf) { toast('PDF library failed to load — check your internet connection.'); return false; }
  /* Mirrors the Word form: US Letter, 15 mm margins, Arial-style type, same table grid, same numbering */
  const { jsPDF } = window.jspdf, doc = new jsPDF({unit:'mm',format:'letter'});
  const PW = 215.9, PH = 279.4, M = 15, R = PW - M, TW = R - M, L = 4.7;
  const tw = t => t / 56.6929;                       // Word twips -> mm
  let y = M + 3.5, qn = 0;
  const font = (st, sz) => { doc.setFont('helvetica', st); doc.setFontSize(sz); doc.setTextColor(0,0,0); };
  const need = h => { if (y + h > PH - M) { doc.addPage(); y = M + 3.5; } };
  const para = (t, st, sz, gap) => { font(st, sz); doc.splitTextToSize(t, TW).forEach(l => { need(L); doc.text(l, M, y); y += L; }); y += gap; };
  const hline = (x1, yy) => { doc.setDrawColor(0); doc.setLineWidth(.2); doc.line(x1, yy, R, yy); };
  const rect = (x, yy, w, h) => { doc.setDrawColor(0); doc.setLineWidth(.25); doc.rect(x, yy, w, h); };
  // Vector check mark (Helvetica has no check glyph), centred on (cx, cy)
  const check = (cx, cy, s) => { doc.setDrawColor(0); doc.setLineWidth(.7); doc.setLineCap(1); doc.setLineJoin(1);
    doc.lines([[s*.35, s*.4], [s*.7, -s*.85]], cx - s*.5, cy + s*.05); doc.setLineWidth(.25); doc.setLineCap(0); doc.setLineJoin(0); };

  // Title block (9 / 10 / 14 pt bold, centred)
  font('bold',9);  doc.text('DEPARTMENT OF SCIENCE AND TECHNOLOGY', PW/2, y, {align:'center'}); y += 4.3;
  font('bold',10); doc.text('NATIONAL RESEARCH COUNCIL OF THE PHILIPPINES', PW/2, y, {align:'center'}); y += 5.2;
  font('bold',14); doc.text('NRCP EXPERT ENGAGEMENT POST-ACTIVITY SURVEY', PW/2, y, {align:'center'}); y += 5;

  // Details table (grid 5264 / 2632 / 1316 / 1316 twips)
  const c1 = tw(5264), c2 = tw(2632), c3 = tw(1316), x1 = M + c1, x2 = x1 + c2, x3 = x2 + c3, rh = 6.4;
  font('bold',10);
  rect(M, y, c1, rh*2);  doc.text('NRCP EXPERT:', M+1.8, y+4.6);
  doc.text(doc.splitTextToSize(data.expert || '', c1 - doc.getTextWidth('NRCP EXPERT:') - 6)[0] || '', M+1.8+doc.getTextWidth('NRCP EXPERT:  '), y+4.6);
  rect(x1, y, c2, rh*2); doc.text('NRCP MEMBERSHIP', x1+c2/2, y+5.1, {align:'center'}); doc.text('STATUS', x1+c2/2, y+9.7, {align:'center'});
  rect(x2, y, c3, rh);   rect(x3, y, c3, rh);
  rect(x2, y+rh, c3, rh); doc.text('REGULAR', x2+c3/2, y+rh+4.5, {align:'center'});
  rect(x3, y+rh, c3, rh); doc.text('ASSOCIATE', x3+c3/2, y+rh+4.5, {align:'center'});
  if (data.status === 'Regular')   check(x2+c3/2, y+rh/2, 4);
  if (data.status === 'Associate') check(x3+c3/2, y+rh/2, 4);
  y += rh*2;
  const row = (l1, v1, l2, v2) => { const w2 = TW - c1; font('bold',10);
    const a = doc.splitTextToSize(l1 + (v1 ? '  ' + v1 : ''), c1 - 3.6), b = doc.splitTextToSize(l2 + (v2 ? '  ' + v2 : ''), w2 - 3.6);
    const h = Math.max(rh, Math.max(a.length, b.length) * 4.4 + 2); need(h);
    rect(M, y, c1, h); rect(x1, y, w2, h);
    a.forEach((t, i) => doc.text(t, M+1.8, y+4.5 + i*4.4)); b.forEach((t, i) => doc.text(t, x1+1.8, y+4.5 + i*4.4)); y += h; };
  row('NRCP DIVISION:', data.division, 'TYPE OF ENGAGEMENT:', data.engagement);
  row('NRCP ACTIVITY:', data.activity, 'Cooperating Institution:', data.institution);
  row('ACTIVITY DATE:', fmtRange(data.date, data.date_end), 'Number of Participants:', data.participants);
  y += 8;

  para('Thank you for your valuable contribution as an expert in our recent activity. To help us assess the utilization of your expertise, the impact on our participants, and the overall management of the implementation, please take a few minutes to complete this questionnaire. Your feedback is essential for our continuous improvement.', 'normal', 11, 3.5);

  const xNum = M + tw(360), xTxt = M + tw(720), xBul = M + tw(1080), xOpt = M + tw(1440);
  STEPS.slice(1).forEach((s, si) => {
    need(26);
    para(s.title.toUpperCase(), 'bold', 11, 1);
    para(s.lead, si < 2 ? 'italic' : 'normal', 11, 2.5);
    s.fields.forEach(f => {
      qn++; const v = data[f.id];
      let label = f.l + (f.t === 'scale' ? ':' : '') + (f.h ? ' (' + f.h + ')' : '');
      font('normal',11); const lines = doc.splitTextToSize(label, R - xTxt);
      need(L*lines.length + L*2); doc.text(qn + '.', xNum, y);
      lines.forEach(l => { doc.text(l, xTxt, y); y += L; });
      y += 0.8;
      if (f.t === 'radio') {
        f.o.forEach(o => { let t = o;
          if (f.spec && o === f.spec) t += ' (please specify: ' + (v === o && data[f.id+'_spec'] ? data[f.id+'_spec'] : '_______________') + ')';
          font(v === o ? 'bold' : 'normal', 11); const ol = doc.splitTextToSize(t, R - xOpt); need(L*ol.length);
          doc.setDrawColor(0); doc.setLineWidth(.25); doc.setFillColor(0,0,0); doc.circle(xBul + 1.2, y - 1.3, 0.9, v === o ? 'FD' : 'S');
          ol.forEach(l => { doc.text(l, xOpt, y); y += L; }); y += si === 0 ? 0 : 1.4; });
        y += 2;
      } else if (f.t === 'scale') {
        need(L*2); doc.setDrawColor(0); doc.setLineWidth(.25); doc.circle(xBul + 1.2, y - 1.3, 0.9, 'S');
        font('normal',11); let cx = xOpt;
        f.o.forEach(o => { doc.text(o, cx, y); cx += doc.getTextWidth(o) + 1.8; rect(cx, y - 2.9, 3.4, 3.4);
          if (v === o) check(cx + 1.7, y - 1.2, 2.8); cx += 3.4 + 4.5; });
        y += L + 3;
      } else {
        if (v && String(v).trim()) { font('normal',11);
          doc.splitTextToSize(String(v), R - xTxt).forEach(l => { need(L+2); doc.text(l, xTxt, y); hline(xTxt, y+1.1); y += 6.2; });
        } else { need(L+2); hline(xTxt, y+1.1); y += 6.2; }
        y += 2;
      }
    });
  });

  need(20); y += 6;
  font('bold',11); doc.text('THANK YOU FOR YOUR TIME AND DEDICATION TO MAKING THIS ACTIVITY A SUCCESS!', PW/2, y, {align:'center'});
  const name = (data.expert||'expert').trim().replace(/[^\w]+/g,'_');
  const fn = `NRCP_Expert_Engagement_Survey_${name}.pdf`; if (silent === 'data') return {fn, b64: doc.output('datauristring').split(',')[1]}; doc.save(fn); if (!silent) toast('PDF downloaded ✓'); return fn;
}
function fmtDate(d){ if(!d) return ''; const x = new Date(d+'T00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-PH',{year:'numeric',month:'long',day:'numeric'}); }

/* ===== Theme toggle ===== */
const TT = document.getElementById('themeToggle');
function setTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem('nrcp-theme', t); } catch (e) {}
  const l = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'; TT.setAttribute('aria-label', l); TT.title = l; }
TT.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
setTheme(document.documentElement.dataset.theme || 'light');

/* ===== Modal (focus trap, Esc, overlay click, focus return) ===== */
const MODAL = document.getElementById('modal'); let lastFocus = null;
function openModal({icon, title, desc, actions, focus = 0}){
  document.getElementById('mIcon').innerHTML = icon; document.getElementById('mTitle').textContent = title; document.getElementById('mDesc').innerHTML = desc;
  const box = document.getElementById('mActions'); box.innerHTML = '';
  actions.forEach(a => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + (a.cls || 'ghost'); b.textContent = a.label; b.onclick = () => { closeModal(); a.fn && a.fn(); }; box.appendChild(b); });
  lastFocus = document.activeElement; MODAL.hidden = false; document.body.classList.add('modal-open'); box.children[focus].focus();
}
function closeModal(){ MODAL.hidden = true; document.body.classList.remove('modal-open'); lastFocus && lastFocus.focus && lastFocus.focus(); }
MODAL.addEventListener('mousedown', e => { if (e.target === MODAL) closeModal(); });
document.addEventListener('keydown', e => {
  if (MODAL.hidden) return;
  if (e.key === 'Escape') return closeModal();
  if (e.key === 'Tab') { const f = [...MODAL.querySelectorAll('button')], i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length-1].focus(); } else if (!e.shiftKey && i === f.length-1) { e.preventDefault(); f[0].focus(); } }
});
const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
function confirmReset(){
  openModal({icon: SVG('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'), title: 'Start over?',
    desc: 'This will clear <b>all your answers</b> and take you back to the first page. This action cannot be undone.',
    actions: [{label: 'Cancel'}, {label: 'Yes, start over', cls: 'primary', fn: () => { data = {}; ALL.forEach(f => { if (f.v) data[f.id] = f.v; }); data.date_end = data.date; data.expert = ''; save(); step = 0; render(); toast('Form cleared'); }}]});
}

/* ===== Send to email ===== */
/* Paste your Google Apps Script Web App URL here to enable one-click sending (see Code.gs). Leave empty to use the email-app fallback. */
const SEND_URL = 'const SEND_URL = 'https://script.google.com/macros/s/AKfycbxYkZpi4yLSXRSRpSQEwJwTtb9x9mvcIrRJs2rnIJwQHP7_MDAlMnUInswcfCvMVN7c/exec';';
const MAIL_TO = 'kareena.abungin@nrcp.dost.gov.ph', MAIL_CC = 'sheerahbagunu28.nrcp@gmail.com';
function emailModal(){
  const subj = 'NRCP Expert Engagement Post-Activity Survey' + (data.expert ? ' – ' + data.expert : '');
  const body = fn => ['Good day,', '', 'Please find attached my accomplished NRCP Expert Engagement Post-Activity Survey' + (fn ? ' (' + fn + ')' : '') + '.', '',
    'NRCP Expert: ' + (data.expert || ''), 'NRCP Division: ' + (data.division || ''), 'Type of Engagement: ' + (data.engagement || ''),
    'NRCP Activity: ' + (data.activity || ''), 'Activity Date: ' + fmtRange(data.date, data.date_end), '', 'Thank you.'].join('\r\n');
  const q = (o, fn) => Object.entries(o).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  const send = async gmail => { const fn = await makePDF(true); if (!fn) return sendError('The PDF could not be created. Please check your internet connection and try again.', () => send(gmail));
    const p = {cc: MAIL_CC, subject: subj, body: body(fn)};
    if (gmail) { if (!window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(MAIL_TO) + '&cc=' + encodeURIComponent(MAIL_CC) + '&su=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body(fn)), '_blank')) return sendError('Your browser blocked the Gmail window. Please allow pop-ups for this page and try again.', () => send(true)); }
    else location.href = 'mailto:' + MAIL_TO + '?' + q(p);
    toast('PDF downloaded — attach it to your email'); };
  const sendError = (msg, retry, fb) => openModal({icon: SVG('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>'), title: 'Email not sent',
    desc: esc(msg) + '<br><br>Your answers are safe — nothing was lost.',
    actions: [{label: 'Close'}].concat(fb ? [{label: 'Use email app instead', fn: () => send(false)}] : [], [{label: 'Try again', cls: 'primary', fn: retry}]), focus: fb ? 2 : 1});
  if (SEND_URL) {
    const ico = SVG('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>');
    const auto = async () => {
      if (!navigator.onLine) return sendError('You appear to be offline. Please check your internet connection.', auto, true);
      toast('Sending…'); const r = await makePDF('data');
      if (!r) return sendError('The PDF could not be created. Please check your internet connection and try again.', auto, true);
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
      try {
        const res = await fetch(SEND_URL, {method: 'POST', signal: ctl.signal, body: JSON.stringify({subject: subj, filename: r.fn, pdf: r.b64, expert: data.expert, division: data.division, engagement: data.engagement, activity: data.activity, date: fmtRange(data.date, data.date_end)})});
        if (!res.ok) throw new Error('The mail service responded with error ' + res.status + '.');
        let j; try { j = await res.json(); } catch (_) { throw new Error('Unexpected response from the mail service. Check that the Apps Script is deployed with access set to “Anyone”.'); }
        if (!j.ok) throw new Error(j.error || 'The mail service reported an error.');
        openModal({icon: SVG('<path d="M20 6 9 17l-5-5"/>'), title: 'Form sent', desc: 'Your survey was emailed to NRCP with the PDF attached. Thank you!', actions: [{label: 'Done', cls: 'primary'}]});
      } catch (e) {
        sendError(e.name === 'AbortError' ? 'The request timed out after 30 seconds.' : /fetch|network/i.test(e.message) ? 'Could not reach the mail service. Please check your internet connection.' : e.message, auto, true);
      } finally { clearTimeout(to); }
    };
    return openModal({icon: ico, title: 'Send to email', desc: 'Your PDF will be emailed automatically — no email app needed.<div class="chips"><span><b>To:</b> ' + MAIL_TO + '</span><span><b>CC:</b> ' + MAIL_CC + '</span></div>',
      actions: [{label: 'Cancel'}, {label: 'Use email app instead', fn: () => send(false)}, {label: 'Send now', cls: 'primary', fn: auto}], focus: 2});
  }
  openModal({icon: SVG('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'), title: 'Send to email',
    desc: 'Your PDF will be downloaded and an email draft will open. <b>Please attach the downloaded PDF</b> before sending.<div class="chips"><span><b>To:</b> ' + MAIL_TO + '</span><span><b>CC:</b> ' + MAIL_CC + '</span></div>',
    actions: [{label: 'Cancel'}, {label: 'Open in Gmail', fn: () => send(true)}, {label: 'Download PDF & open email app', cls: 'primary', fn: () => send(false)}], focus: 2});
}

render();
</script>
